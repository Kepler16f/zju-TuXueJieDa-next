name: gen-ohos-keystore

# 一次性任务：生成鸿蒙发布签名密钥库(.p12)与证书请求文件(.csr)。
# 用法：gh workflow run gen-ohos-keystore.yml
#   1. 下载 artifact：ohos-keystore/ohos_release.p12（妥善保管，丢失无法更新已上架应用！）
#   2. 拿 artifact 里的 app.csr 去 AGC「证书/APP ID/Profile」申请发布证书(.cer)与 Profile(.p7b)
#   3. 把 .cer/.p7b/p12/密码 配进仓库 Secrets（见发布流程说明）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Locate hap-sign-tool
        id: tool
        run: |
          set -e
          JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f 2>/dev/null | head -1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar: $JAR"
          if [ -z "$JAR" ]; then
            echo "::error::no hap-sign-tool jar found"
            exit 1
          fi
      - name: Dump tool help (one-off reconnaissance)
        env:
          SIGN_JAR: ${{ steps.tool.outputs.jar }}
        run: |
          echo "=== TOP-LEVEL HELP ==="
          java -jar "$SIGN_JAR" -h 2>&1 || true
          echo "=== generate-keypair HELP ==="
          java -jar "$SIGN_JAR" generate-keypair -h 2>&1 || true
          echo "=== generate-csr HELP ==="
          java -jar "$SIGN_JAR" generate-csr -h 2>&1 || true
      - name: Generate keypair + CSR
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          SIGN_JAR: ${{ steps.tool.outputs.jar }}
        run: |
          set -e
          mkdir -p out
          java -jar "$SIGN_JAR" generate-keypair \
            -keystore out/ohos_release.p12 \
            -storepass "$KS_PASS" \
            -alias tuxuejieda \
            -keypass "$KS_PASS" \
            -keyalg ECC -keysize NIST-P-256 \
            -signature-algorithm SHA256withECDSA \
            -validity 10950 \
            || { echo "--- generate-keypair usage ---"; java -jar "$SIGN_JAR" generate-keypair --help 2>&1 | head -60; exit 1; }
          java -jar "$SIGN_JAR" generate-csr \
            -keystore out/ohos_release.p12 \
            -storepass "$KS_PASS" \
            -alias tuxuejieda \
            -signature-algorithm SHA256withECDSA \
            -file out/app.csr \
            || { echo "--- generate-csr usage ---"; java -jar "$SIGN_JAR" generate-csr --help 2>&1 | head -60; exit 1; }
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-keystore
          path: |
            out/ohos_release.p12
            out/app.csr
          archive: false
          if-no-files-found: error
