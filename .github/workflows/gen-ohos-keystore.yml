name: gen-ohos-keystore

# 一次性任务：生成鸿蒙发布签名密钥库(.p12)与证书请求文件(.csr)。
# 用法：gh workflow run gen-ohos-keystore.yml
#   1. 下载 artifact：ohos-keystore/ohos_release.p12（妥善保管，丢失无法更新已上架应用！）
#   2. 拿 artifact 里的 app.csr 去 AGC「证书/APP ID/Profile」申请发布证书(.cer)与 Profile(.p7b)
#   3. 把 .cer/.p7b/p12/密码 配进仓库 Secrets（见发布流程说明）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Locate hap-sign-tool
        id: tool
        run: |
          set -e
          HKEYTOOL=$(find /home/runner/ohos-sdk -iname "hkeytool*" -type f 2>/dev/null | head -1)
          JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f 2>/dev/null | head -1)
          echo "hkeytool=$HKEYTOOL" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "hkeytool: $HKEYTOOL"
          echo "jar: $JAR"
          if [ -z "$HKEYTOOL" ] && [ -z "$JAR" ]; then
            echo "::error::no signing tool found under /home/runner/ohos-sdk"
            find /home/runner/ohos-sdk -maxdepth 4 -type d | head -30
            exit 1
          fi
      - name: Generate keystore + CSR
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          HKEYTOOL: ${{ steps.tool.outputs.hkeytool }}
          SIGN_JAR: ${{ steps.tool.outputs.jar }}
        run: |
          set -e
          mkdir -p out
          # hkeytool 与 hap-sign-tool.jar 的 genkeypair/certreq 子命令一致
          if [ -n "$HKEYTOOL" ]; then
            TOOL() { "$HKEYTOOL" "$@"; }
          else
            TOOL() { java -jar "$SIGN_JAR" "$@"; }
          fi
          TOOL -genkeypair \
            -keystore out/ohos_release.p12 \
            -storepass "$KS_PASS" \
            -alias tuxuejieda \
            -keypass "$KS_PASS" \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -signature-algorithm SHA256withECDSA \
            -profile "CN=Kepler16f, OU=Personal, O=Kepler16f, L=Hangzhou, ST=Zhejiang, C=CN"
          TOOL -certreq \
            -keystore out/ohos_release.p12 \
            -storepass "$KS_PASS" \
            -alias tuxuejieda \
            -keypass "$KS_PASS" \
            -file out/app.csr
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-keystore
          path: |
            out/ohos_release.p12
            out/app.csr
          archive: false
          if-no-files-found: error
