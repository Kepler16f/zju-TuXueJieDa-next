name: release

# 手动触发：构建 Windows/Android 安装包并（可选）发布 GitHub Release。
# 版本号每次触发时填入（workflow_dispatch inputs），不由脚本猜测。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.3'
        required: true
        type: string
      build_number:
        description: '构建号（pubspec build 号，默认 1）'
        required: false
        default: '1'
        type: string
      targets:
        description: '构建目标'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
          - ios
      ref:
        description: '构建的代码引用（留空 = main；补发历史版本时填 tag 如 v0.1.3）'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建通过后创建/更新 GitHub Release 并上传产物'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Android split APKs
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Stage renamed APKs
        run: |
          APP="tuxuejieda"
          mkdir -p stage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "stage/${APP}-Android-arm64-v8a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "stage/${APP}-Android-armeabi-v7a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "stage/${APP}-Android-x86_64-${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: stage/*.apk
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            allowed: arm64
            mode64: arm64
          - arch: x64
            runner: windows-latest
            allowed: x64compatible
            mode64: x64compatible
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
          "$env:RUNNER_TEMP\flutter\bin" >> $Env:GITHUB_PATH
      - name: Sync version into pubspec
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml -Raw) `
            -replace '(?m)^version: .*$', "version: ${{ inputs.version }}+${{ inputs.build_number }}" |
            Set-Content pubspec.yaml -NoNewline
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Locate Release output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tuxuejieda_next.exe |
            Select-Object -First 1
          if (-not $exe) { throw "tuxuejieda_next.exe not found under build/windows" }
          "dir=$(Split-Path -Parent $exe.FullName)" >> $Env:GITHUB_OUTPUT
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $app = [string]::new([char[]]@(0x56FE,0x5B66,0x57FA,0x7840,0x6559,0x7A0B,0x4E60,0x9898,0x89E3,0x7B54))
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DMyAppName=$app" `
            "/DMyAllowedArch=${{ matrix.allowed }}" `
            "/DMyInstall64BitMode=${{ matrix.mode64 }}" `
            "/DMySourceDir=${{ steps.out.outputs.dir }}" `
            "/DMyOutputDir=$PWD\stage" `
            "/DMyOutputBaseFilename=tuxuejieda-Windows-${{ matrix.arch }}-${{ inputs.version }}-setup" `
            "/DMyIconPath=$PWD\windows\runner\resources\app_icon.ico" `
            tools\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: stage/*.exe
          if-no-files-found: error

  macos:
    name: macOS app (arm64)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build macos --release
      - name: Zip app bundle
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "no .app found"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "tuxuejieda-macOS-arm64-${{ inputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: tuxuejieda-macOS-arm64-*.zip
          if-no-files-found: error

  linux:
    name: Linux bundle (x64)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config cmake
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build linux --release
      - run: |
          tar czf "tuxuejieda-Linux-x64-${{ inputs.version }}.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: tuxuejieda-Linux-x64-*.tar.gz
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "tuxuejieda-iOS-${{ inputs.version }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: tuxuejieda-iOS-*-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows, macos, linux, ios]
    if: >-
      ${{ always() && inputs.create_release &&
          needs.windows.result == 'success' &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
          (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: windows-installer-*
          path: stage
          merge-multiple: true
      - name: Download android APKs
        if: ${{ needs.android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: stage
      - name: Download macos/linux/ios artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{macos-app,linux-bundle,ios-ipa}"
          path: stage
          merge-multiple: true
      - name: Checksums
        run: |
          cd stage
          files=()
          for f in *.apk *.exe *.zip *.tar.gz; do [ -e "$f" ] && files+=("$f"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Publish release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          {
            echo "## 图学基础教程习题解答 v$V"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 产物 |"
            echo "|---|---|"
            for f in $(ls | grep -v SHA256SUMS | sort); do
              echo "| - | $f |"
            done
            echo ""
            echo "Windows 静默安装参数：/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /FORCECLOSEAPPLICATIONS /ALLUSERS"
            echo ""
            echo "### 说明"
            echo ""
            echo "- Android APK 为 debug 签名供侧载，应用名「图学习题解答」"
            echo "- macOS 应用未签名：首次打开需右键 → 打开，或在终端执行 xattr -cr"
            echo "- iOS IPA 未签名：需自签（AltStore/Sideloadly/TrollStore 等）后安装"
            echo "- Linux 包为 x64 便携 bundle（视频播放暂未支持，后续接入 media_kit）"
            echo "- SHA256SUMS.txt 为上述产物的校验和"
            echo "- 非官方学生重制项目，仅供个人学习交流；原内容版权归原出版方所有。"
          } > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md 2>/dev/null || gh release edit "v$V" --title "v$V" --notes-file notes.md
          gh release upload "v$V" stage/* --clobber
