name: release

# 手动触发：构建 Windows/Android/macOS/Linux/iOS/HarmonyOS 安装包并（可选）发布 Release。
# 版本号每次触发时填入（workflow_dispatch inputs），不由脚本猜测。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.4'
        required: true
        type: string
      build_number:
        description: '构建号（默认 1）'
        required: false
        default: '1'
        type: string
      targets:
        description: '构建目标'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
          - ios
          - ohos
          - web
      ref:
        description: '构建的代码引用（留空 = main；补发历史版本填 tag）'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建通过后创建/更新 GitHub Release（发布需单独征得同意）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Android split APKs
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Stage renamed APKs
        run: |
          APP="tuxuejieda"
          mkdir -p stage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "stage/${APP}-Android-arm64-v8a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "stage/${APP}-Android-armeabi-v7a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "stage/${APP}-Android-x86_64-${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-arm64-v8a
          path: stage/tuxuejieda-Android-arm64-v8a-*.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-armeabi-v7a
          path: stage/tuxuejieda-Android-armeabi-v7a-*.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-x86_64
          path: stage/tuxuejieda-Android-x86_64-*.apk
          archive: false
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            allowed: arm64
            mode64: arm64
          - arch: x64
            runner: windows-latest
            allowed: x64compatible
            mode64: x64compatible
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" fetch --tags --force
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" --version
          "$env:RUNNER_TEMP/flutter/bin" >> $Env:GITHUB_PATH
      - name: Sync version into pubspec
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml -Raw) `
            -replace '(?m)^version: .*$', "version: ${{ inputs.version }}+${{ inputs.build_number }}" |
            Set-Content pubspec.yaml -NoNewline
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Locate Release output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tuxuejieda_next.exe |
            Select-Object -First 1
          if (-not $exe) { throw "tuxuejieda_next.exe not found under build/windows" }
          "dir=$(Split-Path -Parent $exe.FullName)" >> $Env:GITHUB_OUTPUT
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $app = [string]::new([char[]]@(0x56FE,0x5B66,0x57FA,0x7840,0x6559,0x7A0B,0x4E60,0x9898,0x89E3,0x7B54))
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DMyAppName=$app" `
            "/DMyAllowedArch=${{ matrix.allowed }}" `
            "/DMyInstall64BitMode=${{ matrix.mode64 }}" `
            "/DMySourceDir=${{ steps.out.outputs.dir }}" `
            "/DMyOutputDir=$PWD/stage" `
            "/DMyOutputBaseFilename=tuxuejieda-Windows-${{ matrix.arch }}-${{ inputs.version }}-setup" `
            "/DMyIconPath=$PWD/windows/runner/resources/app_icon.ico" `
            tools/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: stage/*.exe
          archive: false
          if-no-files-found: error

  macos:
    name: macOS app (arm64)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build macos --release
      - name: Create DMG
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "no .app found"; exit 1; fi
          brew install create-dmg || true
          create-dmg             --volname "图学基础教程习题解答"             --window-pos 200 120 --window-size 660 420             --icon-size 96 --app-drop-link 440 210             "tuxuejieda-macOS-arm64-${{ inputs.version }}.dmg" "$app" || true
          # create-dmg 失败（退出码非零窗口样式）时退回 hdiutil 只读镜像
          if [ ! -e "tuxuejieda-macOS-arm64-${{ inputs.version }}.dmg" ]; then
            hdiutil create -volname "图学基础教程习题解答" -srcfolder "$app"               -format UDZO -o "tuxuejieda-macOS-arm64-${{ inputs.version }}.dmg"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: tuxuejieda-macOS-arm64-*.dmg
          archive: false
          if-no-files-found: error

  linux:
    name: Linux bundle (${{ matrix.arch }})
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config cmake libnotify-dev
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build linux --release
      - name: Build deb package
        run: |
          VER="${{ inputs.version }}"
          case "${{ matrix.arch }}" in
            x64)   DEB_ARCH="amd64" ;;
            arm64) DEB_ARCH="arm64" ;;
          esac
          DEB_DIR="tuxuejieda_${VER}_${DEB_ARCH}"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/opt/tuxuejieda" "$DEB_DIR/usr/bin" \
            "$DEB_DIR/usr/share/applications" "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/${{ matrix.arch }}/release/bundle/* "$DEB_DIR/opt/tuxuejieda/"
          ln -sf /opt/tuxuejieda/tuxuejieda_next "$DEB_DIR/usr/bin/tuxuejieda"
          cp linux/app_icon_512.png "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/tuxuejieda.png"
          cat > "$DEB_DIR/usr/share/applications/tuxuejieda.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=图学基础教程习题解答
          Exec=/opt/tuxuejieda/tuxuejieda_next
          Icon=tuxuejieda
          Categories=Education;Science;
          DESKTOP
          cat > "$DEB_DIR/DEBIAN/control" <<CONTROL
          Package: tuxuejieda
          Version: $VER
          Architecture: $DEB_ARCH
          Maintainer: Kepler16f
          Description: 图学基础教程习题解答 - 工程图学习题的数字化解答课件
          CONTROL
          dpkg-deb --build "$DEB_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.arch }}
          path: tuxuejieda_*.deb
          archive: false
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "tuxuejieda-iOS-${{ inputs.version }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: tuxuejieda-iOS-*-unsigned.ipa
          archive: false
          if-no-files-found: error

  ohos:
    name: HarmonyOS HAP (arm64, unsigned)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'ohos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      FLUTTER_OHOS_REF: oh-3.47.9-dev
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch "$FLUTTER_OHOS_REF" --depth 1 "$FLUTTER_OHOS_REPO" "$FLUTTER_OHOS_DIR"
          git -C "$FLUTTER_OHOS_DIR" fetch --tags --force || true
          # dev 分支浅克隆没有可描述的 tag，flutter 版本会探测成 0.0.0-unknown，
          # 导致插件声明 flutter: >=x.y.z 的约束全部解析失败。在 HEAD 强制打版本 tag。
          git -C "$FLUTTER_OHOS_DIR" tag -f 3.47.9 HEAD || true
          cd "$FLUTTER_OHOS_DIR"
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
      - name: Configure npm registry
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc
      - name: Cache OHOS pub git overrides
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/git
          key: ohos-pub-git-v1-${{ hashFiles('scripts/setup_ohos.sh') }}
          restore-keys: ohos-pub-git-v1-
      - name: Prepare signing material
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
          CERT_B64: ${{ secrets.OHOS_CERT_BASE64 }}
          PROFILE_B64: ${{ secrets.OHOS_PROFILE_BASE64 }}
        run: |
          set -e
          if [ -n "$KS_PASS" ] && [ -n "$KS_B64" ] && [ -n "$CERT_B64" ] && [ -n "$PROFILE_B64" ]; then
            mkdir -p signing
            echo "$KS_B64" | base64 -d > signing/ohos_release.p12
            echo "$CERT_B64" | base64 -d > signing/chain.cer
            echo "$PROFILE_B64" | base64 -d > signing/app.p7b
            echo "HAVE_SIGNING=true" >> "$GITHUB_ENV"
            ls -la signing/
          else
            echo "HAVE_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Init OHOS host project + plugin overlay
        env:
          OHOS_APP_VERSION: ${{ inputs.version }}
          OHOS_BUILD_NUMBER: ${{ inputs.build_number }}
          OHOS_DEVELOPER: 胡天泽
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 25
          git config --global http.postBuffer 524288000
          # gitee 会限流/断流/卡死 TCP：配置低速超时 + 每次限时 240s 整体重试
          for attempt in 1 2 3 4 5; do
            rm -rf ohos pubspec_overrides.yaml
            if timeout 240 bash -c 'bash scripts/setup_ohos.sh && flutter pub get'; then
              echo "ohos init attempt $attempt ok"
              exit 0
            fi
            echo "::warning::ohos init failed/timed out on attempt $attempt (gitee flaky), retrying in 10s..."
            rm -rf ohos pubspec_overrides.yaml pubspec.lock
            sleep 10
          done
          echo "::error::ohos init failed after 5 attempts"
          exit 1
      - name: Build HAP
        run: |
          set +e
          flutter build hap --release --target-platform ohos-arm64
          status=$?
          set -e
          hap=$(find ohos/entry/build -type f -name '*.hap' 2>/dev/null | head -1)
          if [ -z "$hap" ]; then
            echo "::error::no HAP produced (flutter exit $status)"
            find ohos -name '*.hap' -print || true
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::notice::flutter exited $status (missing signing config); using unsigned HAP from hvigor"
          fi
          # SIG dev 引擎的 libflutter.so 未剥离符号：strip 后重打 HAP（约省 4-6MB）
          python3 scripts/strip_hap_libs.py "$hap" libs/arm64-v8a/libflutter.so
          cp "$hap" "tuxuejieda-HarmonyOS-arm64-${{ inputs.version }}-unsigned.hap"
      - name: Sign HAP
        if: env.HAVE_SIGNING == 'true'
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SIGN_JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f | head -1)
          echo "sign tool: $SIGN_JAR"
          HAP=$(find ohos -name '*.hap' -type f | head -1)
          if [ -z "$HAP" ]; then echo "::error::no hap produced"; exit 1; fi
          mkdir -p signed
          java -jar "$SIGN_JAR" sign-app -mode localSign -keyAlias tuxuejieda -keyPwd "$KS_PASS" -signAlg SHA256withECDSA -keystoreFile signing/ohos_release.p12 -keystorePwd "$KS_PASS" -appCertFile signing/chain.cer -profileFile signing/app.p7b -profileSigned 1 -compatibleVersion 12 -inFile "$HAP" -outFile signed/entry-default-signed.hap
          java -jar "$SIGN_JAR" verify-app -inFile signed/entry-default-signed.hap -outCertChain signed/cert-chain.cer -outProfile signed/profile.p7b
          cp signed/entry-default-signed.hap "tuxuejieda-HarmonyOS-arm64-${{ inputs.version }}-release.hap"
          ls -la signed/
      - name: Locate packing tool
        if: env.HAVE_SIGNING == 'true'
        run: |
          PACK_TOOL=$(find /home/runner/ohos-sdk -maxdepth 8 -type f -name 'app_packing_tool.jar' | head -1)
          echo "pack tool: $PACK_TOOL"
          if [ -z "$PACK_TOOL" ]; then
            echo "::error::app_packing_tool.jar not found"
            find /home/runner/ohos-sdk -name '*.jar' | head -30
            exit 1
          fi
          echo "PACK_TOOL=$PACK_TOOL" >> "$GITHUB_ENV"
      - name: Assemble and sign .app
        if: env.HAVE_SIGNING == 'true'
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SIGN_JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f | head -1)
          mkdir -p dist
          cp signed/entry-default-signed.hap dist/entry-default.hap
          unzip -p signed/entry-default-signed.hap pack.info > dist/pack.info
          python3 scripts/patch_pack_info.py dist/pack.info entry-default.hap
          java -jar "$PACK_TOOL" --mode app \
            --pack-info-path dist/pack.info \
            --hap-path dist/entry-default.hap \
            --out-path "dist/tuxuejieda-HarmonyOS-${{ inputs.version }}-unsigned.app" \
            --replace-pack-info false --force true
          ls -la dist/
          java -jar "$SIGN_JAR" sign-app -mode localSign -keyAlias tuxuejieda -keyPwd "$KS_PASS" -appCertFile signing/chain.cer -profileFile signing/app.p7b -inForm zip -signAlg SHA256withECDSA -keystoreFile signing/ohos_release.p12 -keystorePwd "$KS_PASS" -inFile "dist/tuxuejieda-HarmonyOS-${{ inputs.version }}-unsigned.app" -outFile "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app"
          java -jar "$SIGN_JAR" verify-app -inFile "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app" -outCertChain signed/cert-chain.cer -outProfile signed/profile.p7b || true
          ls -la *.app
      - name: Pack .app into tar.gz (artifacts extract zips, which would drop the signature block)
        if: env.HAVE_SIGNING == 'true'
        run: |
          set -e
          tar czf "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app.tar.gz" \
            "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app"
          ls -la *.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-packages
          path: tuxuejieda-HarmonyOS-*
          archive: false
          if-no-files-found: error

  web:
    name: Web bundle (CanvasKit + Wasm)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build web --release --wasm --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Package Web zip
        run: |
          cd build/web
          zip -qry "../../tuxuejieda-Web-${{ inputs.version }}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: tuxuejieda-Web-*.zip
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows, macos, linux, ios, ohos, web]
    if: >-
      ${{ always() && inputs.create_release &&
          (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
          (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
          (needs.ohos.result == 'success' || needs.ohos.result == 'skipped') &&
          (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          # v7 archive:false 的 artifact 名 = 上传文件名（name 参数被忽略）
          pattern: "tuxuejieda*"
          path: stage
          merge-multiple: true
      - name: Checksums
        run: |
          cd stage
          files=()
          for f in *.apk *.exe *.dmg *.deb *.hap *.ipa *.zip *.tar.gz; do [ -e "$f" ] && files+=("$f"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Publish release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          {
            echo "## 图学基础教程习题解答 v$V"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 产物 |"
            echo "|---|---|"
            for f in $(ls | grep -v SHA256SUMS | sort); do
              echo "| - | $f |"
            done
