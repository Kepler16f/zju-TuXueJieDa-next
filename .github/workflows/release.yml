name: release

# 手动触发：构建 Windows/Android/macOS/Linux/iOS/HarmonyOS 安装包并（可选）发布 Release。
# 版本号每次触发时填入（workflow_dispatch inputs），不由脚本猜测。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.4'
        required: true
        type: string
      build_number:
        description: '构建号（默认 1）'
        required: false
        default: '1'
        type: string
      targets:
        description: '构建目标'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
          - ios
          - ohos
      ref:
        description: '构建的代码引用（留空 = main；补发历史版本填 tag）'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建通过后创建/更新 GitHub Release（发布需单独征得同意）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Android split APKs
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Stage renamed APKs
        run: |
          APP="tuxuejieda"
          mkdir -p stage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "stage/${APP}-Android-arm64-v8a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "stage/${APP}-Android-armeabi-v7a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "stage/${APP}-Android-x86_64-${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-arm64-v8a
          path: stage/tuxuejieda-Android-arm64-v8a-*.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-armeabi-v7a
          path: stage/tuxuejieda-Android-armeabi-v7a-*.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-x86_64
          path: stage/tuxuejieda-Android-x86_64-*.apk
          archive: false
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            allowed: arm64
            mode64: arm64
          - arch: x64
            runner: windows-latest
            allowed: x64compatible
            mode64: x64compatible
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" fetch --tags --force
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" --version
          "$env:RUNNER_TEMP/flutter/bin" >> $Env:GITHUB_PATH
      - name: Sync version into pubspec
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml -Raw) `
            -replace '(?m)^version: .*$', "version: ${{ inputs.version }}+${{ inputs.build_number }}" |
            Set-Content pubspec.yaml -NoNewline
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Locate Release output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tuxuejieda_next.exe |
            Select-Object -First 1
          if (-not $exe) { throw "tuxuejieda_next.exe not found under build/windows" }
          "dir=$(Split-Path -Parent $exe.FullName)" >> $Env:GITHUB_OUTPUT
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $app = [string]::new([char[]]@(0x56FE,0x5B66,0x57FA,0x7840,0x6559,0x7A0B,0x4E60,0x9898,0x89E3,0x7B54))
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DMyAppName=$app" `
            "/DMyAllowedArch=${{ matrix.allowed }}" `
            "/DMyInstall64BitMode=${{ matrix.mode64 }}" `
            "/DMySourceDir=${{ steps.out.outputs.dir }}" `
            "/DMyOutputDir=$PWD/stage" `
            "/DMyOutputBaseFilename=tuxuejieda-Windows-${{ matrix.arch }}-${{ inputs.version }}-setup" `
            "/DMyIconPath=$PWD/windows/runner/resources/app_icon.ico" `
            tools/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: stage/*.exe
          archive: false
          if-no-files-found: error

  macos:
    name: macOS app (arm64)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build macos --release
      - name: Zip app bundle
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "no .app found"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "tuxuejieda-macOS-arm64-${{ inputs.version }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: tuxuejieda-macOS-arm64-*.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux bundle (${{ matrix.arch }})
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config cmake
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build linux --release
      - run: tar czf "tuxuejieda-Linux-${{ matrix.arch }}-${{ inputs.version }}.tar.gz" -C build/linux/${{ matrix.arch }}/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-${{ matrix.arch }}
          path: tuxuejieda-Linux-*.tar.gz
          archive: false
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Flutter 3.47.9 (source checkout)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --tags --force
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sed -i '' "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "tuxuejieda-iOS-${{ inputs.version }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: tuxuejieda-iOS-*-unsigned.ipa
          archive: false
          if-no-files-found: error

  ohos:
    name: HarmonyOS HAP (arm64, unsigned)
    needs: test
    if: ${{ inputs.targets == 'all' || inputs.targets == 'ohos' }}
    runs-on: ubuntu-latest
    env:
      FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      FLUTTER_OHOS_REF: oh-3.47.9-dev
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch "$FLUTTER_OHOS_REF" --depth 1 "$FLUTTER_OHOS_REPO" "$FLUTTER_OHOS_DIR"
          git -C "$FLUTTER_OHOS_DIR" fetch --tags --force || true
          # dev 分支浅克隆没有可描述的 tag，flutter 版本会探测成 0.0.0-unknown，
          # 导致插件声明 flutter: >=x.y.z 的约束全部解析失败。在 HEAD 强制打版本 tag。
          git -C "$FLUTTER_OHOS_DIR" tag -f 3.47.9 HEAD || true
          cd "$FLUTTER_OHOS_DIR"
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
      - name: Configure npm registry
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc
      - name: Init OHOS host project + plugin overlay
        env:
          OHOS_APP_VERSION: ${{ inputs.version }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          bash scripts/setup_ohos.sh
          flutter pub get
      - name: Build HAP (unsigned fallback)
        run: |
          set +e
          flutter build hap --release --target-platform ohos-arm64
          status=$?
          set -e
          hap=$(find ohos/entry/build -type f -name '*.hap' 2>/dev/null | head -1)
          if [ -z "$hap" ]; then
            echo "::error::no HAP produced (flutter exit $status)"
            find ohos -name '*.hap' -print || true
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::notice::flutter exited $status (missing signing config); using unsigned HAP from hvigor"
          fi
          # SIG dev 引擎的 libflutter.so 未剥离符号：strip 后重打 HAP（约省 4-6MB）
          python3 scripts/strip_hap_libs.py "$hap" libs/arm64-v8a/libflutter.so
          cp "$hap" "tuxuejieda-HarmonyOS-arm64-${{ inputs.version }}-unsigned.hap"
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-hap
          path: tuxuejieda-HarmonyOS-arm64-*-unsigned.hap
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows, macos, linux, ios, ohos]
    if: >-
      ${{ always() && inputs.create_release &&
          needs.windows.result == 'success' &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
          (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
          (needs.ohos.result == 'success' || needs.ohos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "{android-apk-*,windows-installer-*,macos-app,linux-bundle-*,ios-ipa,ohos-hap}"
          path: stage
          merge-multiple: true
      - name: Checksums
        run: |
          cd stage
          files=()
          for f in *.apk *.exe *.zip *.tar.gz *.hap; do [ -e "$f" ] && files+=("$f"); done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Publish release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          {
            echo "## 图学基础教程习题解答 v$V"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 产物 |"
            echo "|---|---|"
            for f in $(ls | grep -v SHA256SUMS | sort); do
              echo "| - | $f |"
            done
            echo ""
            echo "Windows 静默安装参数：/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /FORCECLOSEAPPLICATIONS /ALLUSERS"
            echo ""
            echo "### 说明"
            echo ""
            echo "- Android APK 为 debug 签名供侧载，应用名「图学习题解答」"
            echo "- macOS 应用未签名：首次打开需右键 → 打开，或执行 xattr -cr"
            echo "- iOS IPA 未签名：需自签（AltStore/Sideloadly/TrollStore 等）后安装"
            echo "- Linux 包为 x64/arm64 便携 bundle（视频播放暂未支持）"
            echo "- 鸿蒙 HAP 未签名：需 DevEco Studio 签名后安装"
            echo "- SHA256SUMS.txt 为上述产物的校验和"
            echo "- 非官方学生重制项目，仅供个人学习交流；原内容版权归原出版方所有。"
          } > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md 2>/dev/null || gh release edit "v$V" --title "v$V" --notes-file notes.md
          gh release upload "v$V" stage/* --clobber
