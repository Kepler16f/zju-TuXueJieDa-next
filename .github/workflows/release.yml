name: release

# 手动触发：构建 Windows/Android 安装包并（可选）发布 GitHub Release。
# 版本号每次触发时填入（workflow_dispatch inputs），不由脚本猜测。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.3'
        required: true
        type: string
      build_number:
        description: '构建号（pubspec build 号，默认 1）'
        required: false
        default: '1'
        type: string
      targets:
        description: '构建目标'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - android
      create_release:
        description: '构建通过后创建 GitHub Release 并上传产物'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Android split APKs
    needs: test
    if: ${{ inputs.targets != 'windows' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ inputs.build_number }}/" pubspec.yaml
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Stage renamed APKs
        run: |
          # ASCII stage names: upload-artifact strips non-ASCII; the release
          # job renames files back to the Chinese app-name prefix.
          APP="tuxuejieda"
          mkdir -p stage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "stage/${APP}-Android-arm64-v8a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "stage/${APP}-Android-armeabi-v7a-${{ inputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "stage/${APP}-Android-x86_64-${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: stage/*.apk
          if-no-files-found: error

  windows:
    name: Windows arm64 installer
    needs: test
    if: ${{ inputs.targets != 'android' }}
    # 必须用 ARM64 runner：官方不发 Windows arm64 release zip，但 arm64 主机上的
    # Flutter 工具会原生下载 windows-arm64 的 Dart SDK 与引擎构件（同本地构建）。
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.47.9 (source checkout; subosito zip lacks arm64)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
          "$env:RUNNER_TEMP\flutter\bin" >> $Env:GITHUB_PATH
      - name: Sync version into pubspec
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml -Raw) `
            -replace '(?m)^version: .*$', "version: ${{ inputs.version }}+${{ inputs.build_number }}" |
            Set-Content pubspec.yaml -NoNewline
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Locate Release output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tuxuejieda_next.exe |
            Select-Object -First 1
          if (-not $exe) { throw "tuxuejieda_next.exe not found under build/windows" }
          "dir=$(Split-Path -Parent $exe.FullName)" >> $Env:GITHUB_OUTPUT
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $app = [string]::new([char[]]@(0x56FE,0x5B66,0x57FA,0x7840,0x6559,0x7A0B,0x4E60,0x9898,0x89E3,0x7B54))
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DMyAppName=$app" `
            "/DMyAllowedArch=arm64" `
            "/DMyInstall64BitMode=arm64" `
            "/DMySourceDir=${{ steps.out.outputs.dir }}" `
            "/DMyOutputDir=$PWD\stage" `
            "/DMyOutputBaseFilename=tuxuejieda-Windows-arm64-${{ inputs.version }}-setup" `
            "/DMyIconPath=$PWD\windows\runner\resources\app_icon.ico" `
            tools\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: stage/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: ${{ always() && inputs.create_release && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: stage
      - name: Rename to release names (Chinese app prefix) + checksums
        run: |
          cd stage
          V="${{ inputs.version }}"
          APP="图学基础教程习题解答"
          mv "tuxuejieda-Android-arm64-v8a-$V.apk"       "$APP-Android-arm64-v8a-$V.apk"
          mv "tuxuejieda-Android-armeabi-v7a-$V.apk"     "$APP-Android-armeabi-v7a-$V.apk"
          mv "tuxuejieda-Android-x86_64-$V.apk"          "$APP-Android-x86_64-$V.apk"
          mv "tuxuejieda-Windows-arm64-$V-setup.exe"     "$APP-Windows-arm64-$V-setup.exe"
          sha256sum "$APP"-*.apk "$APP"-*.exe > SHA256SUMS.txt
      - name: Publish release (gh CLI; patch unicode asset names)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          APP="图学基础教程习题解答"
          {
            echo "## $APP v$V"
            echo ""
            echo "- **Windows arm64**：$APP-Windows-arm64-$V-setup.exe（Inno Setup 安装器，静默安装参数 \`/VERYSILENT /ALLUSERS\`）"
            echo "- **Android**：按架构分包 APK（arm64-v8a / armeabi-v7a / x86_64），应用名「图学习题解答」，debug 签名供侧载"
            echo "- SHA256SUMS.txt 为上述产物的校验和"
            echo ""
            echo "非官方学生重制项目，仅供个人学习交流；原内容版权归原出版方所有。"
          } > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md 2>/dev/null || gh release edit "v$V" --title "v$V" --notes-file notes.md
          gh release upload "v$V" stage/* --clobber
          # Some upload paths strip non-ASCII asset names; patch each one back.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            new=""
            case "$name" in
              "tuxuejieda-Android-arm64-v8a-$V.apk")    new="$APP-Android-arm64-v8a-$V.apk" ;;
              "tuxuejieda-Android-armeabi-v7a-$V.apk")  new="$APP-Android-armeabi-v7a-$V.apk" ;;
              "tuxuejieda-Android-x86_64-$V.apk")       new="$APP-Android-x86_64-$V.apk" ;;
              "tuxuejieda-Windows-arm64-$V-setup.exe")  new="$APP-Windows-arm64-$V-setup.exe" ;;
            esac
            if [ -n "$new" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --jq '.name'
            fi
          done
