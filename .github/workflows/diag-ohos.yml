name: diag-ohos

# 一次性诊断：打印 Flutter-ohos 模板原生的宿主工程规格（build-profile 签名配置等）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Clone Flutter-ohos SDK
        run: |
          git clone --depth 1 --branch oh-3.47.9-dev \
            https://gitcode.com/openharmony-tpc/flutter_flutter.git "$RUNNER_TEMP/flutter_ohos"
          cd "$RUNNER_TEMP/flutter_ohos"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter_ohos"
          echo "$RUNNER_TEMP/flutter_ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter_ohos" >> "$GITHUB_ENV"
      - name: Create ohos host project and dump spec
        run: |
          flutter config --enable-openharmony || true
          flutter create --platforms ohos --project-name tuxuejieda_next . >/dev/null 2>&1 || true
          echo "=== build-profile.json5 ==="
          cat ohos/build-profile.json5 2>/dev/null || echo "(missing)"
          echo "=== hvigorfile.ts ==="
          cat ohos/hvigorfile.ts 2>/dev/null || echo "(missing)"
          echo "=== entry/hvigorfile.ts ==="
          cat ohos/entry/hvigorfile.ts 2>/dev/null || echo "(missing)"
          echo "=== oh-package.json5 ==="
          cat ohos/oh-package.json5 2>/dev/null || echo "(missing)"
          echo "=== hvigorw ==="
          ls -la ohos/hvigorw 2>/dev/null || echo "(no hvigorw)"
          echo "=== hvigor config dir ==="
          ls -la ohos/hvigor 2>/dev/null || true
