name: build-ohos-release

# 鸿蒙发布包（.app）：签名 HAP → 组装 .app → 给 .app 本体签名（AGC 必需）。
# 前置：仓库 Secrets 已配置
#   OHOS_KEYSTORE_PASSWORD  密钥库密码
#   OHOS_KEYSTORE_BASE64    ohos_signing/ohos_release.p12 的 base64
#   OHOS_CERT_BASE64        AGC 下载的证书链 .cer 的 base64
#   OHOS_PROFILE_BASE64     AGC 签发的发布 Profile .p7b 的 base64
on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.7'
        required: true
        type: string
      build_number:
        description: '构建号'
        required: false
        default: '1'
        type: string
      upload_to_agc:
        description: '签名后是否尝试上传到 AppGallery Connect（需配置 AGC 凭据）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch oh-3.47.9-dev --depth 1 https://gitcode.com/openharmony-tpc/flutter_flutter.git "$FLUTTER_OHOS_DIR"
          git -C "$FLUTTER_OHOS_DIR" fetch --tags --force || true
          git -C "$FLUTTER_OHOS_DIR" tag -f 3.47.9 HEAD || true
          cd "$FLUTTER_OHOS_DIR"
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
      - name: Configure npm registry
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc
      - name: Cache OHOS pub git overrides
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/git
          key: ohos-pub-git-v1-${{ hashFiles('scripts/setup_ohos.sh') }}
          restore-keys: ohos-pub-git-v1-
      - name: Prepare signing material
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
          CERT_B64: ${{ secrets.OHOS_CERT_BASE64 }}
          PROFILE_B64: ${{ secrets.OHOS_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p signing
          echo "$KS_B64" | base64 -d > signing/ohos_release.p12
          echo "$CERT_B64" | base64 -d > signing/chain.cer
          echo "$PROFILE_B64" | base64 -d > signing/app.p7b
          ls -la signing/
      - name: Init OHOS host project
        env:
          OHOS_APP_VERSION: ${{ inputs.version }}
          OHOS_BUILD_NUMBER: ${{ inputs.build_number }}
          OHOS_DEVELOPER: 胡天泽
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 25
          git config --global http.postBuffer 524288000
          for attempt in 1 2 3 4 5; do
            rm -rf ohos pubspec_overrides.yaml
            if timeout 240 bash -c 'bash scripts/setup_ohos.sh && flutter pub get'; then
              echo "init ok (attempt $attempt)"; exit 0
            fi
            echo "::warning::init failed (attempt $attempt), retry"
            rm -rf ohos pubspec_overrides.yaml pubspec.lock
            sleep 10
          done
          exit 1
      - name: Build HAP
        run: |
          set +e
          flutter build hap --release --target-platform ohos-arm64
          status=$?
          set -e
          find ohos -name '*.hap' | head -5
          echo "flutter exit=$status"
      - name: Sign HAP
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SIGN_JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f | head -1)
          echo "sign tool: $SIGN_JAR"
          HAP=$(find ohos -name '*.hap' -type f | head -1)
          if [ -z "$HAP" ]; then echo "::error::no hap produced"; exit 1; fi
          mkdir -p signed
          java -jar "$SIGN_JAR" sign-app -mode localSign -keyAlias tuxuejieda -keyPwd "$KS_PASS" -signAlg SHA256withECDSA -keystoreFile signing/ohos_release.p12 -keystorePwd "$KS_PASS" -appCertFile signing/chain.cer -profileFile signing/app.p7b -profileSigned 1 -compatibleVersion 12 -inFile "$HAP" -outFile signed/entry-default-signed.hap
          java -jar "$SIGN_JAR" verify-app -inFile signed/entry-default-signed.hap -outCertChain signed/cert-chain.cer -outProfile signed/profile.p7b
          ls -la signed/
      - name: Locate packing tool
        run: |
          PACK_TOOL=$(find /home/runner/ohos-sdk -maxdepth 8 -type f -name 'app_packing_tool.jar' | head -1)
          echo "pack tool: $PACK_TOOL"
          if [ -z "$PACK_TOOL" ]; then
            echo "::error::app_packing_tool.jar not found"
            find /home/runner/ohos-sdk -name '*.jar' | head -30
            exit 1
          fi
          echo "PACK_TOOL=$PACK_TOOL" >> "$GITHUB_ENV"
      - name: Assemble and sign .app
        env:
          KS_PASS: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SIGN_JAR=$(find /home/runner/ohos-sdk -iname "hap-sign-tool*.jar" -type f | head -1)
          mkdir -p dist
          # .app 内的 HAP 用标准名（pack.info 的 hapList 与之一致）
          cp signed/entry-default-signed.hap dist/entry-default.hap
          # pack.info 从签名 HAP 提取，并注入 hapList（AGC 靠它解析 .app，缺失会报 996）
          unzip -p signed/entry-default-signed.hap pack.info > dist/pack.info
          python3 scripts/patch_pack_info.py dist/pack.info entry-default.hap
          # 官方 packing tool 打包 .app（不要手工 zip，AGC 会报包结构错误）
          java -jar "$PACK_TOOL" --mode app \
            --pack-info-path dist/pack.info \
            --hap-path dist/entry-default.hap \
            --out-path "dist/tuxuejieda-HarmonyOS-${{ inputs.version }}-unsigned.app" \
            --replace-pack-info false --force true
          ls -la dist/
          # .app 外层签名：-inForm zip 按 App Pack 容器签名（AGC 991 的根因就是缺这层）
          java -jar "$SIGN_JAR" sign-app -mode localSign -keyAlias tuxuejieda -keyPwd "$KS_PASS" -appCertFile signing/chain.cer -profileFile signing/app.p7b -inForm zip -signAlg SHA256withECDSA -keystoreFile signing/ohos_release.p12 -keystorePwd "$KS_PASS" -inFile "dist/tuxuejieda-HarmonyOS-${{ inputs.version }}-unsigned.app" -outFile "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app"
          java -jar "$SIGN_JAR" verify-app -inFile "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app" -outCertChain signed/cert-chain.cer -outProfile signed/profile.p7b || true
          ls -la *.app
      - name: Pack .app and .hap into tar.gz (artifacts extract zips, which would drop the signature block)
        run: |
          set -e
          cp signed/entry-default-signed.hap "tuxuejieda-HarmonyOS-arm64-${{ inputs.version }}-release.hap"
          tar czf "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app.tar.gz" \
            "tuxuejieda-HarmonyOS-${{ inputs.version }}-release.app" \
            "tuxuejieda-HarmonyOS-arm64-${{ inputs.version }}-release.hap"
          ls -la *.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-release-app
          path: tuxuejieda-HarmonyOS-*-release.app.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload to AppGallery Connect
        if: ${{ inputs.upload_to_agc }}
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
        run: |
          set -e
          if [ -z "$AGC_CLIENT_ID" ]; then
            echo "::error::AGC credentials not configured"; exit 1
          fi
          echo "See AGC open API docs for app upload endpoint; configure per your tenant."
