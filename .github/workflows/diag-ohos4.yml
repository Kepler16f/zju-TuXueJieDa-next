name: diag-ohos4

# 一次性诊断 #4：dump hvigor 签名配置 schema 与签名命令构建器源码。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Dump signing schema
        run: |
          P=/home/runner/ohos-sdk/command-line-tools/hvigor/hvigor-ohos-plugin
          echo "=== schema: signingConfigs section ==="
          python3 - <<'PY'
import json
p = "/home/runner/ohos-sdk/command-line-tools/hvigor/hvigor-ohos-plugin/res/schemas/ohos-project-build-profile-schema.json"
d = json.load(open(p, encoding="utf-8"))
def find(node, path=""):
    if isinstance(node, dict):
        if "signingConfigs" in node:
            print("PATH:", path)
            print(json.dumps(node["signingConfigs"], ensure_ascii=False, indent=2)[:3000])
        for k, v in node.items():
            find(v, path + "/" + str(k))
    elif isinstance(node, list):
        for i, v in enumerate(node):
            find(v, path + f"[{i}]")
find(d)
PY
      - name: Dump sign command builder
        run: |
          P=/home/runner/ohos-sdk/command-line-tools/hvigor/hvigor-ohos-plugin
          echo "=== common-sign-command-builder.js ==="
          sed -n '1,140p' "$P/src/tasks/sign/command-builder-impl/common-sign-command-builder.js"
          echo "=== sign-util.d.ts ==="
          sed -n '1,120p' "$P/src/tasks/sign/sign-util.d.ts"
