name: diag-ohos4

# 一次性诊断 #4：dump hvigor 签名配置 schema 与签名命令构建器源码。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - name: Dump hvigor signing schema and sign builder
        run: python3 scripts/dump_decipher.py
